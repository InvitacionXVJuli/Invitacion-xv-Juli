<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XV Julieta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Montserrat,sans-serif;background:#eef6ff;color:#fff}section{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.hero{background:url("img/save-date.jpeg") center/cover no-repeat}.countdown{background:linear-gradient(180deg,#dfeeff,#bfdcff)}.box{position:relative;z-index:2}.title{letter-spacing:6px;color:#6d89a8;font-size:14px}#days{font-family:"Cormorant Garamond",serif;font-size:120px;color:#fff;text-shadow:0 0 20px #fff}.glitter{position:absolute;inset:0}.spark{position:absolute;border-radius:50%;background:white;opacity:.7}.historia{background:#f8fbff;color:#4d6c90;flex-direction:column}.historia h2{font-family:"Cormorant Garamond",serif;font-size:56px;margin-bottom:30px}.slider{display:flex;align-items:center;gap:20px}.slider img{width:320px;height:500px;object-fit:cover;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.2)}.slider button{width:50px;height:50px;border:none;border-radius:50%;cursor:pointer}.dots{margin-top:20px}.dot{width:10px;height:10px;background:#bfd1e5;border-radius:50%;display:inline-block;margin:0 4px}.active{background:#769dc8}.image{background-size:cover;background-position:center}.image:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}.content{position:relative;z-index:2}.content h2{font-family:"Cormorant Garamond",serif;font-size:64px}.content p{margin-top:10px}.btn{display:inline-block;margin-top:20px;padding:12px 24px;background:white;color:#333;text-decoration:none;border-radius:30px}@media(max-width:768px){#days{font-size:80px}.slider img{width:250px;height:380px}.content h2{font-size:42px}}
</style>
</head>
<body>
<section class="hero"></section>
<section class="countdown"><div class="glitter" id="glitter"></div><div class="box"><div class="title">CAMINO HACIA UN DÍA ÚNICO</div><div id="days">0</div><div class="title">DÍAS</div></div></section>
<section class="historia"><h2>UN RECORRIDO ESPECIAL</h2><div class="slider"><button onclick="prevSlide()">‹</button><img id="sliderImage" src="img/historia1.jpg"><button onclick="nextSlide()">›</button></div><div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div></section>
<section class="image" style="background-image:url('img/save-date.jpeg')"><div class="content"><h2>27 DICIEMBRE 2026</h2><p>DOMINGO</p></div></section>
<section class="image" style="background-image:url('img/salon.jpg')"><div class="content"><h2>LA CELEBRACIÓN</h2><p>SANFIZ EVENTOS</p></div></section>
<section class="image" style="background-image:url('img/dresscode.jpg')"><div class="content"><h2>DRESS CODE</h2><p>ELEGANTE</p></div></section>
<section class="image" style="background-image:url('img/rsvp.jpg')"><div class="content"><h2>CONFIRMACIÓN DE ASISTENCIA</h2><p>PRÓXIMAMENTE</p></div></section>
<script>
const eventDate=new Date('2026-12-27T21:00:00').getTime();setInterval(()=>{const d=Math.floor((eventDate-Date.now())/(1000*60*60*24));document.getElementById('days').textContent=d;},1000);
for(let i=0;i<70;i++){let s=document.createElement('div');s.className='spark';let z=Math.random()*12+2;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';if(z>8)s.style.filter='blur(2px)';s.animate([{transform:'translateY(0)'},{transform:'translate('+(Math.random()*120-60)+'px,-700px)'}],{duration:12000+Math.random()*15000,iterations:Infinity});glitter.appendChild(s)}
const photos=['img/historia1.jpg','img/historia2.jpg','img/historia3.jpg'];let current=0;function paint(){sliderImage.src=photos[current];document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));document.querySelectorAll('.dot')[current].classList.add('active')}function nextSlide(){current=(current+1)%photos.length;paint()}function prevSlide(){current=(current+photos.length-1)%photos.length;paint()}
</script>
</body></html>
