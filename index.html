<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Julieta</title>

<link href="https://fonts.googleapismily=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:'Montserrat',sans-serif;
overflow-x:hidden;
background:#f8fbff;
}

section{
min-height:100vh;
position:relative;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

h1,h2{
font-family:'Cormorant Garamond',serif;
font-weight:400;
}

/* SAVE THE DATE */

.hero{
background:url('img/save-date.jpeg') center center/cover no-repeat;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,.10);
backdrop-filter:blur(1px);
}

.hero-content{
position:relative;
z-index:2;
color:#333;
}

.hero h1{
font-size:7rem;
letter-spacing:8px;
line-height:.95;
}

.hero .fecha{
margin-top:40px;
font-size:2rem;
letter-spacing:4px;
}

.hero .nombre{
margin-top:60px;
font-size:2rem;
letter-spacing:12px;
}

/* COUNTDOWN */

.countdown{
background:linear-gradient(
180deg,
#eaf4ff 0%,
#d8e9ff 50%,
#c8def9 100%
);
}

.countdown-content{
position:relative;
z-index:20;
color:white;
}

.countdown-title{
font-size:14px;
letter-spacing:6px;
margin-bottom:25px;
}

#days{
font-family:'Cormorant Garamond',serif;
font-size:10rem;
line-height:1;
text-shadow:
0 0 20px rgba(255,255,255,.7),
0 0 50px rgba(255,255,255,.4);
}

.days-label{
margin-top:10px;
letter-spacing:8px;
}

/* GLITTER ATRAS */

.glitter-back{

position:absolute;
inset:0;
z-index:5;

}

.glitter-back span{

position:absolute;
background:white;
border-radius:50%;

animation:float1 linear infinite;

}

/* GLITTER ADELANTE */

.glitter-front{

position:absolute;
inset:0;
z-index:30;
pointer-events:none;

}

.glitter-front span{

position:absolute;
background:white;
border-radius:50%;

animation:float2 linear infinite;

}

/* posiciones aleatorias */

.glitter-back span:nth-child(1){
width:5px;height:5px;
left:12%;top:90%;
animation-duration:22s;
}

.glitter-back span:nth-child(2){
width:18px;height:18px;
left:80%;top:80%;
opacity:.3;
filter:blur(3px);
animation-duration:35s;
}

.glitter-back span:nth-child(3){
width:8px;height:8px;
left:30%;top:70%;
animation-duration:25s;
}

.glitter-back span:nth-child(4){
width:12px;height:12px;
left:60%;top:85%;
animation-duration:28s;
}

.glitter-back span:nth-child(5){
width:4px;height:4px;
left:45%;top:65%;
animation-duration:18s;
}

.glitter-back span:nth-child(6){
width:15px;height:15px;
left:90%;top:45%;
opacity:.4;
filter:blur(4px);
animation-duration:40s;
}

.glitter-front span:nth-child(1){
width:6px;height:6px;
left:22%;top:88%;
animation-duration:17s;
}

.glitter-front span:nth-child(2){
width:14px;height:14px;
left:75%;top:92%;
opacity:.7;
animation-duration:26s;
}

.glitter-front span:nth-child(3){
width:3px;height:3px;
left:55%;top:72%;
animation-duration:20s;
}

.glitter-front span:nth-child(4){
width:9px;height:9px;
left:18%;top:55%;
animation-duration:24s;
}

.glitter-front span:nth-child(5){
width:20px;height:20px;
left:50%;top:95%;
opacity:.2;
filter:blur(5px);
animation-duration:38s;
}

.glitter-front span:nth-child(6){
width:7px;height:7px;
left:86%;top:60%;
animation-duration:21s;
}

@keyframes float1{

0%{
transform:translate(0,0) scale(1);
opacity:.2;
}

50%{
opacity:1;
}

100%{
transform:translate(90px,-500px) scale(1.2);
opacity:0;
}

}

@keyframes float2{

0%{
transform:translate(0,0);
opacity:.1;
}

50%{
opacity:1;
}

100%{
transform:translate(-60px,-600px);
opacity:0;
}

}

/* HISTORIA */

.historia{
background:#f7fbff;
flex-direction:column;
padding:60px 20px;
}

.historia h2{
font-size:4rem;
margin-bottom:30px;
color:#3a4c6b;
}

.slider{
display:flex;
align-items:center;
gap:20px;
}

.slider img{
width:320px;
height:500px;
object-fit:cover;
border-radius:25px;
box-shadow:0 25px 50px rgba(0,0,0,.15);
}

.slider button{
border:none;
width:60px;
height:60px;
border-radius:50%;
background:white;
cursor:pointer;
font-size:24px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.dots{
margin-top:25px;
}

.dot{
width:12px;
height:12px;
background:#c6d6ea;
display:inline-block;
border-radius:50%;
margin:6px;
}

.active{
background:#7ea6cf;
}

/* BLOQUES */

.image-section{
background-size:cover;
background-position:center;
}

.image-section::before{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,.40);
}

.content{
position:relative;
z-index:2;
color:white;
padding:30px;
}

.content h2{
font-size:4rem;
}

.content p{
margin-top:20px;
font-size:1.2rem;
letter-spacing:2px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:14px 30px;
background:white;
color:#222;
text-decoration:none;
border-radius:40px;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
font-size:4rem;
}

#days{
font-size:6rem;
}

.historia h2{
font-size:2.5rem;
}

.slider img{
width:260px;
height:400px;
}

.content h2{
font-size:2.4rem;
}

}

</style>

</head>

<body>

<script>

const eventDate =
new Date("December 27, 2026 21:00:00").getTime();

setInterval(() => {

const now = new Date().getTime();

const distance = eventDate - now;

const days = Math.floor(
distance / (1000*60*60*24)
);

document.getElementById("days").innerHTML = days;

},1000);

const photos = [

"img/historia1.jpg",
"img/historia2.jpg",
"img/historia3.jpg"

];

let current = 0;

function showSlide(){

document.getElementById("sliderImage").src =
photos[current];

document.querySelectorAll('.dot')
.forEach(dot => dot.classList.remove('active'));

document.querySelectorAll('.dot')
[current]
.classList.add('active');

}

function nextSlide(){

current++;

if(current >= photos.length){
current = 0;
}

showSlide();

}

function prevSlide(){

current--;

if(current < 0){
current = photos.length - 1;
}

showSlide();

}

</script>

</body>
</html>
