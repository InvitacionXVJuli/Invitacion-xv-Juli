<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Julieta</title>

https://fonts.googleapis.com
https://fonts.gstatic.com

<link href="https://fonts.om/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
    background:#f7fbff;
}

/* ===================================
   SECCIONES
=================================== */

section{
    min-height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* ===================================
   SAVE THE DATE
=================================== */

.hero{

    height:100vh;

    background-image:url('img/save-date.jpeg');
    background-size:cover;
    background-position:center;

}

/* ===================================
   CUENTA REGRESIVA
=================================== */

.countdown{

    background:
    linear-gradient(
    180deg,
    #edf6ff 0%,
    #dbeafe 100%
    );

    flex-direction:column;
    color:white;

}

.countdown-content{

    z-index:10;
    text-align:center;

}

.countdown-title{

    color:#6f8fb2;

    letter-spacing:6px;

    font-size:13px;

    margin-bottom:20px;

}

#days{

    font-family:'Cormorant Garamond',serif;

    font-size:140px;

    line-height:1;

    color:white;

    text-shadow:
    0 0 15px rgba(255,255,255,.8),
    0 0 30px rgba(255,255,255,.6);

}

.days-label{

    color:#6f8fb2;

    letter-spacing:8px;

    margin-top:10px;

}

/* ===================================
   GLITTER
=================================== */

#glitter-back,
#glitter-front{

    position:absolute;
    inset:0;

}

#glitter-front{
    z-index:15;
    pointer-events:none;
}

.spark{

    position:absolute;

    background:white;

    border-radius:50%;
}

/* ===================================
   HISTORIA
=================================== */

.historia{

    background:#f8fcff;

    flex-direction:column;

    padding:50px 20px;

}

.historia h2{

    font-family:'Cormorant Garamond',serif;

    font-size:60px;

    color:#58779e;

    margin-bottom:40px;

}

.slider{

    display:flex;
    align-items:center;
    gap:20px;

}

.slider img{

    width:320px;
    height:500px;

    object-fit:cover;

    border-radius:25px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.15);

}

.slider button{

    width:55px;
    height:55px;

    border:none;

    border-radius:50%;

    background:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
    0 5px 20px rgba(0,0,0,.15);

}

.dots{

    margin-top:25px;

}

.dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#c8d7e7;

    display:inline-block;

    margin:0 5px;

}

.dot.active{
    background:#7aa3cf;
}

/* ===================================
   BLOQUES
=================================== */

.image-section{

    background-size:cover;
    background-position:center;

}

.image-section::before{

    content:"";

    position:absolute;
    inset:0;

    background:rgba(0,0,0,.35);

}

.content{

    position:relative;

    z-index:5;

    color:white;

    text-align:center;

    padding:20px;

}

.content h2{

    font-family:'Cormorant Garamond',serif;

    font-size:70px;

}

.content p{

    margin-top:15px;

    letter-spacing:3px;

}

.btn{

    display:inline-block;

    margin-top:30px;

    text-decoration:none;

    padding:14px 28px;

    background:white;

    color:#333;

    border-radius:30px;

}

/* ===================================
   MOBILE
=================================== */

@media(max-width:768px){

    #days{
        font-size:90px;
    }

    .historia h2{
        font-size:42px;
    }

    .slider img{

        width:250px;
        height:380px;

    }

    .content h2{
        font-size:45px;
    }

}

</style>

</head>
<body>

<!-- SAVE THE DATE -->

<section class="hero"></section>

<!-- CUENTA REGRESIVA -->

<section class="countdown">

    <div id="glitter-back"></div>

    <div class="countdown-content">

        <div class="countdown-title">
            CAMINO HACIA UN DÍA ÚNICO
        </div>

        <div id="days">0</div>

        <div class="days-label">
            DÍAS
        </div>

    </div>

    <div id="glitter-front"></div>

</section>

<!-- HISTORIA -->

<section class="historia">

    <h2>UN RECORRIDO ESPECIAL</h2>

    <div class="slider">

        <button onclick="prevSlide()">‹</button>

        img/historia1.jpg

        <button onclick="nextSlide()">›</button>

    </div>

    <div class="dots">

        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</section>

<!-- FECHA -->

<section
class="image-section"
style="background-image:url('img/save-date.jpeg')">

    <div class="content">

        <h2>27 DICIEMBRE 2026</h2>

        <p>DOMINGO</p>

    </div>

</section>

<!-- LUGAR -->

<section
class="image-section"
style="background-image:url('img/salon.jpg')">

    <div class="content">

        <h2>LA CELEBRACIÓN</h2>

        <p>SANFIZ EVENTOS</p>

    </div>

</section>

<!-- DRESS CODE -->

<section
class="image-section"
style="background-image:url('img/dresscode.jpg')">

    <div class="content">

        <h2>DRESS CODE</h2>

        <p>ELEGANTE</p>

    </div>

</section>

<!-- RSVP -->

<section
class="image-section"
style="background-image:url('img/rsvp.jpg')">

    <div class="content">

        <h2>CONFIRMACIÓN</h2>

        <p>PRÓXIMAMENTE</p>

    </div>

</section>

<script>

/* ==========================
   CUENTA REGRESIVA
========================== */

const eventDate =
new Date("December 27, 2026 21:00:00").getTime();

setInterval(() => {

    const now = new Date().getTime();

    const distance = eventDate - now;

    const days =
    Math.floor(distance / (1000*60*60*24));

    document.getElementById("days").innerHTML = days;

},1000);

/* ==========================
   GLITTER
========================== */

function createSpark(containerId){

    const container =
    document.getElementById(containerId);

    for(let i=0;i<35;i++){

        const spark =
        document.createElement("div");

        spark.className = "spark";

        const size =
        Math.random()*10 + 2;

        spark.style.width =
        size + "px";

        spark.style.height =
        size + "px";

        spark.style.left =
        Math.random()*100 + "%";

        spark.style.top =
        Math.random()*100 + "%";

        spark.style.opacity =
        Math.random();

        if(size > 8){
            spark.style.filter="blur(2px)";
        }

        spark.animate(

        [
            {
              transform:"translate(0,0)",
              opacity:.1
            },
            {
              transform:
              `translate(${Math.random()*100-50}px,-600px)`,
              opacity:1
            }
        ],

        {
            duration:
            12000 + Math.random()*15000,

            iterations:
            Infinity
        });

        container.appendChild(spark);

    }

}

createSpark("glitter-back");
createSpark("glitter-front");

/* ==========================
   SLIDER
========================== */

const photos = [

"img/historia1.jpg",
"img/historia2.jpg",
"img/historia3.jpg"

];

let current = 0;

function updateSlider(){

document.getElementById("sliderImage").src =
photos[current];

document.querySelectorAll(".dot")
.forEach(dot =>
dot.classList.remove("active"));

document.querySelectorAll(".dot")
[current]
.classList.add("active");

}

function nextSlide(){

current++;

if(current >= photos.length){

current = 0;

}

updateSlider();

}

function prevSlide(){

current--;

if(current < 0){

current = photos.length - 1;

}

updateSlider();

}

</script>

</body>
</html>
